name: Night Routine Bot

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > service_account.json

      - name: Run Bot
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ROUTINE_DATA_SOURCE_ID: ${{ secrets.ROUTINE_DATA_SOURCE_ID }}
          REMINDER_DATA_SOURCE_ID: ${{ secrets.REMINDER_DATA_SOURCE_ID }}
        run: python night_bot.py
